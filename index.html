<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>LOKKO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       LOKKO × NIKE — Noir & blanc pur. Rien d'autre.
       ═══════════════════════════════════════════ */
    :root{
      --noir:#000; --blanc:#fff; --g90:#1A1A1A; --g70:#4D4D4D;
      --g50:gray; --g30:#B3B3B3; --g10:#EBEBEB; --g05:#F6F6F6;
      --display:'Archivo', 'Helvetica Now', Impact, sans-serif;
      --body:'Inter', -apple-system, sans-serif;
      --mono:'JetBrains Mono', monospace;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{font-family:var(--body);background:var(--noir);color:var(--noir);overflow:hidden;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--noir);color:var(--blanc)}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{display:none}
    .app{width:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--blanc);position:relative;overflow:hidden;display:flex;flex-direction:column}

    .up{display:inline-block;transform:translateY(14px);transition:transform .25s,opacity .25s;opacity:0}
    .up.on{transform:none;opacity:1}

    /* ═══ SPLASH ═══ */
    .splash{position:absolute;inset:0;z-index:500;background:var(--noir);color:var(--blanc);display:flex;flex-direction:column;justify-content:flex-end;padding:44px;animation:splashOut .6s var(--ease) 1.5s forwards}
    .splash .wm{font-family:var(--display);font-style:italic;font-weight:900;font-size:64px;letter-spacing:-2px;line-height:.95;text-transform:uppercase;animation:wordIn .7s var(--ease) both}
    .splash .wm span{display:block;font-size:11px;font-style:normal;font-weight:700;letter-spacing:5px;margin-top:14px;color:var(--g50)}
    @keyframes wordIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @keyframes splashOut{to{opacity:0;visibility:hidden}}

    /* ═══ ONBOARDING ═══ */
    .onboard{position:absolute;inset:0;z-index:400;background:var(--blanc);padding:calc(env(safe-area-inset-top,0px)+56px) 28px 40px;display:flex;flex-direction:column;animation:fadeIn .4s}
    .onboard h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:1.05;letter-spacing:-.5px}
    .onboard .ob-sub{font-size:13px;color:var(--g70);margin-top:12px;line-height:1.6}
    .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
    .ob-chip{border:1.5px solid var(--noir);border-radius:999px;padding:16px;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.5px;min-height:56px;display:flex;align-items:center;justify-content:center;transition:all .18s}
    .ob-chip.on{background:var(--noir);color:var(--blanc)}
    .ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}

    /* ═══ BOUTONS NIKE ═══ */
    .btn-black{width:100%;min-height:56px;border-radius:999px;background:var(--noir);color:var(--blanc);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .2s}
    .btn-black:active{transform:scale(.97);opacity:.85}
    .btn-white{width:100%;min-height:56px;border-radius:999px;background:var(--blanc);color:var(--noir);border:1.5px solid var(--noir);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
    .btn-white:active{transform:scale(.97)}
    .btn-ghost{width:100%;min-height:48px;border-radius:999px;color:var(--g70);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ═══ TOP BAR ═══ */
    .topbar{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px)+14px) 20px 0;height:calc(env(safe-area-inset-top,0px)+56px);pointer-events:none}
    .topbar .wm{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:19px;letter-spacing:-.5px;margin-left:4px}
    .timer-chip{display:flex;align-items:center;gap:7px;pointer-events:auto;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:1px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);padding:8px 13px;border-radius:999px;border:1.5px solid var(--noir)}
    .timer-chip.urgent{background:var(--noir);color:var(--blanc)}
    .timer-chip svg{width:12px;height:12px;stroke:currentColor}

    /* ═══ FEED — STACK PHYSIQUE ═══ */
    .feed{flex:1;position:relative;background:var(--blanc);overflow:hidden}
    .card{position:absolute;inset:10px 10px 10px;border-radius:4px;overflow:hidden;background-size:cover;background-position:center;will-change:transform,opacity;touch-action:none;box-shadow:0 1px 0 var(--g10)}
    .card.behind{transform:scale(.945) translateY(12px);z-index:1}
    .card.behind .card-content{opacity:0}
    .card.fg{z-index:2;animation:cardIn .45s var(--ease) both}
    @keyframes cardIn{from{transform:scale(1.03)}to{transform:none}}
    .card.dragging{transition:none;animation:none}
    .card.fly{transition:transform .42s var(--ease),opacity .42s}
    .card.out-left{transform:translate(-130%,calc(var(--dy,0)*1px)) rotate(-10deg)!important;opacity:0}
    .card.out-right{transform:translate(130%,calc(var(--dy,0)*1px)) rotate(10deg)!important;opacity:0}
    .card.out-up{transform:translate(0,-130%) scale(.92)!important;opacity:0}
    .card.snap{transition:transform .32s var(--ease)}
    .card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 26%,transparent 45%),linear-gradient(to bottom,rgba(0,0,0,.4) 0%,transparent 18%)}
    .card-content{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px calc(env(safe-area-inset-bottom,0px)+150px);color:var(--blanc);pointer-events:none;transition:opacity .2s}

    /* stamps façon tampon */
    .stamp{position:absolute;top:78px;z-index:9;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border:3.5px solid;border-radius:8px;opacity:0;transition:opacity .12s;pointer-events:none;background:rgba(255,255,255,.12);backdrop-filter:blur(4px)}
    .stamp.s-l{left:22px;transform:rotate(-14deg);color:#fff;border-color:#fff}
    .stamp.s-r{right:22px;transform:rotate(14deg);color:#fff;border-color:#fff}
    .stamp.s-u{top:130px;left:50%;margin-left:-80px;width:160px;text-align:center;transform:rotate(-3deg);color:#fff;border-color:#fff}
    .stamp.show{opacity:1}

    .cycle-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:2px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--noir);margin-bottom:12px;text-transform:uppercase}
    .p-brand{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:34px;letter-spacing:-1px;line-height:1}
    .p-title{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:1.5px;margin-top:6px;color:rgba(255,255,255,.85)}
    .p-meta{font-size:11px;color:rgba(255,255,255,.6);margin-top:6px}
    .price-zone{height:44px;margin-top:12px;position:relative}
    .price-blur{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:15px;letter-spacing:6px;color:rgba(255,255,255,.65);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:9px 20px 9px 25px;border-radius:999px;border:1px solid rgba(255,255,255,.35);transition:all .45s var(--ease)}
    .price-real{position:absolute;left:2px;top:-2px;font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:-1px;opacity:0;transform:translateY(12px);transition:all .55s var(--ease);text-shadow:0 2px 16px rgba(0,0,0,.4)}
    .price-real .cur{font-size:16px;font-weight:700;margin-left:5px;color:rgba(255,255,255,.7)}
    .price-zone.revealed .price-blur{opacity:0;transform:scale(.95)}
    .price-zone.revealed .price-real{opacity:1;transform:none}
    .price-hint{position:absolute;left:4px;top:50px;font-size:8.5px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.4);transition:opacity .4s;font-weight:600}
    .price-zone.revealed .price-hint{opacity:0}
    .tap-detail{position:absolute;top:calc(env(safe-area-inset-top,0px)+64px);right:16px;z-index:4;font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--noir);background:rgba(255,255,255,.9);padding:7px 12px;border-radius:999px;animation:fadeIn 1s .5s both}

    /* barre progression */
    .prog{position:absolute;left:10px;right:10px;top:10px;height:3px;z-index:5;background:rgba(255,255,255,.3)}
    .prog i{display:block;height:100%;background:var(--blanc)}

    /* ═══ ACTIONS ═══ */
    .actions{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px)+96px);display:flex;justify-content:center;align-items:center;gap:18px;z-index:8}
    .act{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blanc);border:1.5px solid var(--noir);box-shadow:0 4px 16px rgba(0,0,0,.14);transition:transform .15s,background .15s}
    .act:active{transform:scale(.86)}
    .act svg{width:21px;height:21px;stroke:var(--noir)}
    .act.solid{background:var(--noir);border-color:var(--noir);width:66px;height:66px}
    .act.solid svg{stroke:var(--blanc);width:25px;height:25px}
    .act-tip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px)+76px);display:flex;justify-content:center;gap:18px;z-index:8;pointer-events:none}
    .act-tip span{width:54px;text-align:center;font-size:8px;letter-spacing:1.8px;text-transform:uppercase;color:var(--blanc);font-weight:700;opacity:.9}
    .act-tip span:nth-child(2){width:66px}
    .undo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+96px);right:18px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff}
    .undo svg{width:18px;height:18px;stroke:#fff}

    /* ═══ NAV NIKE ═══ */
    .nav{position:absolute;bottom:0;left:0;right:0;z-index:70;height:calc(env(safe-area-inset-bottom,0px)+74px);background:var(--blanc);border-top:1px solid var(--g10);display:flex;align-items:center;justify-content:space-around;padding-bottom:calc(env(safe-area-inset-bottom,0px)+2px)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:48px;min-height:44px;justify-content:center;color:var(--g50);transition:color .2s}
    .nav-item svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6}
    .nav-item span{font-family:var(--display);font-weight:700;font-size:8px;letter-spacing:1.5px;text-transform:uppercase}
    .nav-item.active{color:var(--noir)}
    .nav-plus{width:52px;height:52px;border-radius:50%;background:var(--noir);color:var(--blanc);display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s}
    .nav-plus:active{transform:scale(.9)}
    .nav-plus svg{width:22px;height:22px;stroke:var(--blanc);stroke-width:2.4}

    /* ═══ FICHE PRODUIT DÉTAILLÉE ═══ */
    .detail{position:absolute;inset:0;z-index:120;background:var(--blanc);display:flex;flex-direction:column;animation:slideIn .38s var(--ease)}
    @keyframes slideIn{from{transform:translateY(4%);opacity:0}to{transform:none;opacity:1}}
    .detail-nav{position:absolute;top:calc(env(safe-area-inset-top,0px)+10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:5}
    .icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--g10);display:flex;align-items:center;justify-content:center}
    .icon-btn svg{width:17px;height:17px;stroke:var(--noir)}
    .detail-body{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+110px)}
    .gal{position:relative}
    .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}
    .gal-item{flex:0 0 100%;height:470px;scroll-snap-align:center;background-size:cover;background-position:center}
    .gal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
    .gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s}
    .gal-dots i.on{background:var(--blanc);width:18px;border-radius:3px}
    .gal-count{position:absolute;bottom:10px;right:16px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.9)}
    .gal-zoom{position:absolute;top:calc(env(safe-area-inset-top,0px)+64px);left:16px;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.92);border:1px solid var(--g10);padding:6px 10px;border-radius:999px}
    .d-head{padding:22px 22px 0}
    .d-sold{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g50)}
    .d-brand{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:30px;letter-spacing:-1px;margin-top:6px;line-height:1}
    .d-name{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.5px;margin-top:4px}
    .d-price{font-family:var(--display);font-weight:900;font-size:26px;margin-top:14px;letter-spacing:-.5px}
    .d-price .rev{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--g50);display:block;margin-top:5px;letter-spacing:0}
    .d-cyc{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;border:1.5px solid var(--noir);border-radius:999px;padding:7px 12px;text-transform:uppercase;font-weight:500}
    .d-sect{margin:26px 22px 0;border-top:1px solid var(--g10);padding-top:20px}
    .d-sect h4{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:2px;margin-bottom:14px}
    .spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--g05);font-size:13px}
    .spec-row:last-child{border-bottom:none}
    .spec-row .k{color:var(--g70)}
    .spec-row .v{font-weight:600}
    .d-desc{font-size:13.5px;line-height:1.7;color:#333}
    /* rapport trust */
    .trust-box{border:1.5px solid var(--noir);border-radius:16px;padding:18px}
    .trust-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .trust-head .sc{font-family:var(--display);font-weight:900;font-size:38px;line-height:1}
    .trust-head .lb{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:2px;background:var(--noir);color:var(--blanc);padding:7px 12px;border-radius:999px}
    .trust-bar{height:6px;background:var(--g10);border-radius:3px;overflow:hidden;margin-bottom:16px}
    .trust-bar i{display:block;height:100%;background:var(--noir)}
    .check-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-family:var(--display)}
    .check-row .ok{width:20px;height:20px;border-radius:50%;background:var(--noir);color:var(--blanc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .check-row .ok svg{width:11px;height:11px;stroke:var(--blanc);stroke-width:3}
    .check-row .det{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--g50);font-weight:400;letter-spacing:0;text-transform:none}
    /* vendeur */
    .seller-row{display:flex;align-items:center;gap:14px}
    .seller-av{width:54px;height:54px;border-radius:50%;background:var(--noir);color:var(--blanc);font-family:var(--display);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
    .seller-row .nm{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.5px}
    .seller-row .st{font-size:11.5px;color:var(--g70);margin-top:3px}
    .seller-row .sc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:500}
    /* sticky CTA */
    .d-cta{position:absolute;bottom:0;left:0;right:0;background:var(--blanc);border-top:1px solid var(--g10);padding:14px 20px calc(env(safe-area-inset-bottom,0px)+16px);display:flex;gap:10px;z-index:6}

    /* ═══ SHEETS (offre, ajustement) ═══ */
    .overlay{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fadeIn .2s}
    .sheet{width:100%;background:var(--blanc);border-radius:22px 22px 0 0;padding:12px 24px calc(env(safe-area-inset-bottom,0px)+26px);max-height:88dvh;overflow-y:auto;animation:slideup .35s var(--ease)}
    @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
    .sheet-handle{width:44px;height:4px;border-radius:2px;background:var(--g30);margin:0 auto 18px}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .sheet-title{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px;letter-spacing:-.3px}
    .sheet-close{width:44px;height:44px;margin:-11px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--noir)}
    .sheet-close svg{width:17px;height:17px;stroke:currentColor;stroke-width:2}
    .prod-row{display:flex;gap:14px;align-items:center;margin-bottom:20px}
    .prod-thumb{width:64px;height:64px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--g10)}
    .prod-row .pb{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px}
    .prod-row .pt{font-size:11.5px;color:var(--g70);margin-top:2px}
    .prod-row .pp{font-family:var(--mono);font-size:12px;margin-top:5px;font-weight:500}
    .field-label{font-family:var(--display);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .offer-input-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--noir);border-radius:14px;padding:2px 18px;margin-bottom:14px}
    .offer-input{flex:1;border:none;outline:none;font-family:var(--display);font-weight:900;font-size:30px;padding:12px 0;width:100%;background:none;color:var(--noir)}
    .offer-cur{font-family:var(--display);font-weight:800;font-size:18px}
    .mkt{margin:2px 2px 18px}
    .mkt-track{position:relative;height:10px;background:var(--g05);border:1.5px solid var(--noir);border-radius:5px}
    .mkt-gold{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--noir) 0 3px,transparent 3px 7px)}
    .mkt-ai{position:absolute;top:-2px;bottom:-2px;border:1.5px dashed var(--g50);border-radius:6px;background:rgba(0,0,0,.05)}
    .mkt-dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--noir);border:3px solid var(--blanc);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:left .12s}
    .mkt-marks{display:flex;justify-content:space-between;margin-top:11px}
    .mkt-marks span{font-size:8.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g70)}
    .mkt-marks .b{color:var(--noir)}
    .info-banner{display:flex;gap:11px;align-items:flex-start;font-size:12px;line-height:1.55;color:var(--g70);background:var(--g05);border-radius:12px;padding:13px 15px;margin-bottom:18px}
    .info-banner svg{width:15px;height:15px;stroke:var(--noir);flex-shrink:0;margin-top:1px}
    .info-banner strong{color:var(--noir)}
    .pills{display:flex;gap:10px;margin-bottom:20px}

  /* ═══ SWIPE CARD — physique réelle ═══ */
  function SwipeCard({p,next,onOpen,onOffer,onToast,onFav,onSkip,canUndo,prev}){
    const [d,setD]=useState(null);
    const [out,setOut]=useState(null);
    const [snap,setSnap]=useState(false);
    const [rev,setRev]=useState(false);
    const st=useRef(null), t0=useRef(0);

    useEffect(()=>{setRev(false);const t=setTimeout(()=>setRev(true),3000);return()=>clearTimeout(t)},[p.id]);

    const tx=e=>e.touches?e.touches[0]:e;
    const down=e=>{st.current=tx(e);t0.current=Date.now();setSnap(false);setD({dx:0,dy:0})};
    const move=e=>{if(!st.current)return;const t=tx(e);setD({dx:t.clientX-st.current.clientX,dy:t.clientY-st.current.clientY})};
    const up=()=>{
      if(!d)return;
      const {dx,dy}=d, dt=(Date.now()-t0.current)/1000;
      const v=Math.abs(dx)/(dt||.3);
      st.current=null;setD(null);
      const fast=v>900;
      if((dy<-110||(dy<-60&&fast))&&Math.abs(dy)>Math.abs(dx)){setOut('up');setTimeout(()=>onOffer(p),300)}
      else if(dx>90||(dx>50&&fast)){setOut('right');setTimeout(()=>{onToast('Gardé');onFav(p)},360)}
      else if(dx<-90||(dx<-50&&fast)){setOut('left');setTimeout(onSkip,360)}
      else{setSnap(true);setD({dx:0,dy:0})}
    };

    const cls='card '+(out==='left'?'fly out-left':out==='right'?'fly out-right':out==='up'?'fly out-up':'fg')+(d&&!out?' dragging':'')+(snap?' snap':'');
    const rot=(d?d.dx:0)/20;
    const style={backgroundImage:`url(${p.img})`,...(d&&!out?{transform:`translate(${d.dx}px,${d.dy}px) rotate(${rot}deg)`,opacity:Math.max(.6,1-Math.abs(d.dx)/700),'--dy':d.dy}:{})};
    const sL=d&&d.dx<-40?' show':'', sR=d&&d.dx>40?' show':'', sU=d&&d.dy<-50?' show':'';

    return <>
      {next&&<div className="card behind" style={{backgroundImage:`url(${next.img})`}}><div className="card-content"/></div>}
      <div className={cls} style={style}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={()=>{st.current=null;setD(null)}}>
        <div className="prog"><i style={{width:(p.pct*100)+'%',background:p.pct>0.83?'#fff':'#fff'}}/></div>
        <div className={'stamp s-l'+sL}>Ignorer</div>
        <div className={'stamp s-r'+sR}>Garder</div>
        <div className={'stamp s-u'+sU}>Offrir</div>
        <button className="tap-detail" onClick={(e)=>{e.stopPropagation();onOpen(p)}}>{I.search} Détails</button>
        <div className="card-content" onClick={()=>onOpen(p)} style={{pointerEvents:'auto'}}>
          <span className="cycle-chip">{I.clock} Cycle {p.cycle}/3 {p.select?' · SELECT':''}</span>
          <div className="p-brand">{p.brand}</div>
          <div className="p-title">{p.title}</div>
          <div className="p-meta">{p.meta} · {p.seller}</div>
          <div className={'price-zone'+(rev?' revealed':'')}>
            <span className="price-blur">•••••</span>
            <span className="price-real">{p.price.toLocaleString('fr-FR')}<span className="cur">{p.cur}</span></span>
            <span className="price-hint">Silence visuel</span>
          </div>
        </div>
      </div>
      <div className="actions">
        <button className="act" onClick={()=>{setOut('right');setTimeout(()=>onFav(p),360)}} title="Favori">{I.heart}</button>
        <button className="act solid" onClick={()=>{setOut('up');setTimeout(()=>onOffer(p),300)}} title="Faire une offre">{I.tag}</button>
        <button className="act" onClick={()=>{setOut('left');setTimeout(onSkip,360)}} title="Passer">{I.x}</button>
      </div>
      <div className="act-tip"><span>Garder</span><span>Offrir</span><span>Passer</span></div>
      {canUndo&&<button className="undo" onClick={prev}>{I.undo}</button>}
    </>;
  }

    return(
      <div className="app">
        {phase==='splash'&&<Splash/>}
        {phase==='onboard'&&<Onboard done={()=>setPhase('app')}/>}
        {phase==='app'&&<>
          {tab==='feed'&&(p?<>
            <TopBar timer={p.timer} urgent={p.pct>0.83}/>
            <div className="feed">
              <SwipeCard key={p.id} p={p} next={PRODUCTS[idx+1]}
                onOpen={setOpen} onOffer={setBid} onToast={sh}
                onFav={()=>next()} onSkip={next}
                canUndo={hist.length>0} prev={prev}/>
            </div>
          </>:<>
            <TopBar/>
            <div className="feed"><div className="feed-end">
              <h3>Le luxe<br/>respire.</h3>
              <p>Revenez demain —<br/>l'IA affine en silence</p>
              <button className="btn-black" style={{width:200,marginTop:10}} onClick={()=>{setIdx(0);setHist([])}}>Recommencer</button>
            </div></div>
          </>)}
          {tab==='search'&&<div className="screen"><Search/></div>}
          {tab==='sell'&&<div className="screen"><Studio onToast={sh}/></div>}
          {tab==='dressing'&&<div className="screen"><Dressing onAlert={()=>setAlert(true)}/></div>}
          {tab==='profile'&&<div className="screen"><Profile/></div>}
          {tab!=='feed'&&<TopBar/>}
          <Nav tab={tab} setTab={setTab}/>
        </>}
        {open&&<Detail p={open} onBack={()=>setOpen(null)} onOffer={pp=>{setBid(pp)}} onToast={sh}/>}
        {bid&&<BidSheet p={bid} onClose={()=>setBid(null)} onSubmit={()=>{sh('Offre envoyée');setOpen(null)}}/>}
        {alert&&<AdjustModal onClose={()=>setAlert(false)} onToast={sh}/>}
        {toast&&<div className="toast">{I.check}{toast}</div>}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
