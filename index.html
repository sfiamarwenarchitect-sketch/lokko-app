<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>LOKKO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════
       LOKKO — "Silent Luxury × Nike Codes"
       Noir #000 · Blanc #FFF — rien d'autre
       Typo : Cormorant Garamond (maison de couture)
       UI   : Inter · Timer : mono
       Boutons : pilules pleines. Icônes : cercles. Cartes : 2px.
       ═══════════════════════════════════════════════════ */
    :root{
      --noir:#000; --blanc:#fff; --g70:#4D4D4D; --g50:#8C8C8C; --g30:#B8B8B8; --g15:#DCDCDC; --g05:#F5F5F5;
      --serif:'Cormorant Garamond',Georgia,serif;
      --sans:'Inter',-apple-system,sans-serif;
      --mono:'JetBrains Mono',monospace;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{font-family:var(--sans);background:var(--noir);overflow:hidden;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--noir);color:var(--blanc)}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{display:none}
    .app{width:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--blanc);position:relative;overflow:hidden;display:flex;flex-direction:column}
    .kick{font-family:var(--sans);font-size:8.5px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase}

    /* ═══ SPLASH ═══ */
    .splash{position:absolute;inset:0;z-index:500;background:var(--noir);color:var(--blanc);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashOut .8s var(--ease) 1.8s forwards}
    .splash .wm{font-family:var(--serif);font-size:46px;font-weight:500;letter-spacing:18px;margin-left:18px;animation:wordIn 1s var(--ease) both}
    .splash .rule{width:54px;height:1px;background:var(--blanc);margin:22px 0;transform-origin:center;animation:ruleIn 1s var(--ease) .3s both}
    .splash .tag{font-size:8.5px;font-weight:500;letter-spacing:4.5px;text-transform:uppercase;color:var(--g50);animation:wordIn 1s var(--ease) .55s both}
    @keyframes wordIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes ruleIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes splashOut{to{opacity:0;visibility:hidden}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ═══ ONBOARDING ═══ */
    .onboard{position:absolute;inset:0;z-index:400;background:var(--blanc);padding:calc(env(safe-area-inset-top,0px)+70px) 32px 44px;display:flex;flex-direction:column;animation:fadeIn .5s}
    .onboard h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-.5px;color:var(--noir)}
    .onboard h1 em{font-style:italic}
    .onboard .ob-sub{font-size:13px;color:var(--g70);margin-top:14px;line-height:1.7;font-weight:400}
    .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px}
    .ob-chip{border:1px solid var(--g15);border-radius:999px;padding:15px;font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--g70);min-height:52px;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .ob-chip.on{background:var(--noir);color:var(--blanc);border-color:var(--noir)}
    .ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:12px}

    /* ═══ BOUTONS — codes Nike ═══ */
    .btn-black{width:100%;min-height:58px;border-radius:999px;background:var(--noir);color:var(--blanc);font-size:11.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s}
    .btn-black:active{transform:scale(.97);opacity:.85}
    .btn-white{width:64px;min-height:58px;border-radius:999px;background:var(--blanc);color:var(--noir);border:1px solid var(--g15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
    .btn-white:active{transform:scale(.95)}
    .btn-white svg{width:19px;height:19px;stroke:var(--noir)}
    .btn-ghost{width:100%;min-height:46px;color:var(--g50);font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
    .hairline{width:36px;height:1px;background:var(--noir);margin:18px 0}

    /* ═══ TOP BAR ═══ */
    .topbar{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px)+16px) 24px 0;height:calc(env(safe-area-inset-top,0px)+58px);pointer-events:none}
    .topbar .wm{font-family:var(--serif);font-size:15px;letter-spacing:7px;font-weight:500;margin-left:4px}
    .topbar.inv .wm{color:var(--blanc)}
    .timer-chip{display:flex;align-items:center;gap:8px;pointer-events:auto;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:var(--blanc);background:rgba(0,0,0,.45);backdrop-filter:blur(14px);padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3)}
    .timer-chip.on-light{color:var(--noir);background:rgba(255,255,255,.75);border-color:var(--g15)}
    .timer-chip svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.5}

    /* ═══ FEED ═══ */
    .feed{flex:1;position:relative;background:var(--blanc);overflow:hidden}
    .card{position:absolute;inset:0;border-radius:0;overflow:hidden;background:var(--noir);will-change:transform,opacity;touch-action:none}
    .ph{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(100%) contrast(1.06)}
    .card.behind{transform:scale(.96) translateY(10px);z-index:1}
    .card.fg{z-index:2;animation:cardIn .5s var(--ease) both}
    @keyframes cardIn{from{transform:scale(1.02)}to{transform:none}}
    .card.dragging{transition:none;animation:none}
    .card.fly{transition:transform .45s var(--ease),opacity .45s}
    .card.out-left{transform:translate(-120%,0) rotate(-8deg)!important;opacity:0}
    .card.out-right{transform:translate(120%,0) rotate(8deg)!important;opacity:0}
    .card.out-up{transform:translate(0,-120%) scale(.94)!important;opacity:0}
    .card.snap{transition:transform .35s var(--ease)}
    .card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.3) 30%,transparent 52%),linear-gradient(to bottom,rgba(0,0,0,.42) 0%,transparent 20%)}
    .card-content{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 30px 196px;color:var(--blanc)}

    /* tampons */
    .stamp{position:absolute;top:128px;z-index:9;font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;padding:10px 20px;opacity:0;transition:opacity .12s;pointer-events:none;font-family:var(--sans)}
    .stamp.s-l{left:28px;transform:rotate(-11deg);color:#fff;border:1.5px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(6px)}
    .stamp.s-r{right:28px;transform:rotate(11deg);color:var(--noir);background:#fff;border-radius:999px;border:1.5px solid #fff}
    .stamp.s-u{top:158px;left:50%;margin-left:-60px;width:120px;text-align:center;transform:rotate(-2deg);color:var(--noir);background:#fff;border-radius:999px;border:1.5px solid #fff}
    .stamp.show{opacity:1}

    .lot-line{display:flex;align-items:center;gap:10px;margin-bottom:20px}
    .lot-line .dot{width:5px;height:5px;border-radius:50%;background:var(--blanc);animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .lot-line span{font-size:8.5px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:rgba(255,255,255,.8)}
    .p-brand{font-family:var(--serif);font-style:italic;font-weight:500;font-size:42px;letter-spacing:1px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.45)}
    .p-title{font-family:var(--serif);font-size:16px;font-weight:400;font-style:italic;color:rgba(255,255,255,.88);margin-top:8px;letter-spacing:.5px}
    .price-zone{height:48px;margin-top:16px;position:relative}
    .price-blur{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:14px;letter-spacing:7px;color:rgba(255,255,255,.65);background:rgba(0,0,0,.45);backdrop-filter:blur(12px);padding:11px 22px 11px 27px;border-radius:999px;border:1px solid rgba(255,255,255,.35);transition:all .5s var(--ease)}
    .price-real{position:absolute;left:2px;top:-6px;font-family:var(--serif);font-weight:500;font-size:38px;letter-spacing:1px;opacity:0;transform:translateY(12px);transition:all .6s var(--ease);text-shadow:0 4px 24px rgba(0,0,0,.4)}
    .price-real .cur{font-size:20px;font-style:italic;margin-left:8px;color:rgba(255,255,255,.75);font-family:var(--serif)}
    .price-zone.revealed .price-blur{opacity:0;transform:scale(.95)}
    .price-zone.revealed .price-real{opacity:1;transform:none}
    .drop-prog{margin-top:18px}
    .drop-prog .bar{height:1px;background:rgba(255,255,255,.28);position:relative}
    .drop-prog .bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .4s}
    .drop-prog .lbl{display:flex;justify-content:space-between;margin-top:8px}
    .drop-prog .lbl span{font-size:8px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.6)}

    /* dock */
    .dock{position:absolute;left:28px;right:28px;bottom:calc(env(safe-area-inset-bottom,0px)+100px);z-index:8;display:flex;align-items:center;gap:14px}
    .dock .rnd{width:54px;height:54px;flex-shrink:0;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;transition:transform .15s}
    .dock .rnd:active{transform:scale(.86)}
    .dock .rnd svg{width:19px;height:19px;stroke:#fff;stroke-width:1.5}
    .dock .cta{flex:1;min-height:56px;border-radius:999px;background:var(--blanc);color:var(--noir);font-size:11px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 36px rgba(0,0,0,.45);transition:transform .15s}
    .dock .cta:active{transform:scale(.97)}
    .dock .cta svg{width:14px;height:14px;stroke:var(--noir);stroke-width:1.6}
    .dock-tip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px)+82px);z-index:8;display:flex;justify-content:center;pointer-events:none}
    .dock-tip span{font-size:7.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45)}
    .undo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+100px);right:28px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35)}
    .undo svg{width:16px;height:16px;stroke:#fff;stroke-width:1.5}

    /* ═══ NAV ═══ */
    .nav{position:absolute;bottom:0;left:0;right:0;z-index:70;height:calc(env(safe-area-inset-bottom,0px)+74px);background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--g15);display:flex;align-items:center;justify-content:space-around;padding-bottom:calc(env(safe-area-inset-bottom,0px)+2px)}
    .nav.dark{background:rgba(0,0,0,.78);border-top:1px solid rgba(255,255,255,.12)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:50px;min-height:44px;justify-content:center;color:var(--g50);transition:color .2s}
    .nav.dark .nav-item{color:rgba(255,255,255,.45)}
    .nav-item svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.4}
    .nav-item span{font-size:7.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase}
    .nav-item.active{color:var(--noir)}
    .nav.dark .nav-item.active{color:var(--blanc)}
    .nav-plus{width:52px;height:52px;border-radius:50%;background:var(--noir);color:var(--blanc);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .15s}
    .nav.dark .nav-plus{background:var(--blanc);color:var(--noir)}
    .nav-plus:active{transform:scale(.9)}
    .nav-plus svg{width:20px;height:20px;stroke:currentColor;stroke-width:2}

    /* ═══ FICHE PRODUIT ═══ */
    .detail{position:absolute;inset:0;z-index:120;background:var(--blanc);display:flex;flex-direction:column;animation:slideIn .4s var(--ease)}
    @keyframes slideIn{from{transform:translateY(3%);opacity:0}to{transform:none;opacity:1}}
    .detail-nav{position:absolute;top:calc(env(safe-area-inset-top,0px)+12px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:5}
    .icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid var(--g15);display:flex;align-items:center;justify-content:center}
    .icon-btn.inv{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.4);backdrop-filter:blur(12px)}
    .icon-btn svg{width:16px;height:16px;stroke:var(--noir);stroke-width:1.6}
    .icon-btn.inv svg{stroke:#fff}
    .detail-body{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+104px)}
    .gal{position:relative;background:var(--noir)}
    .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}
    .gal-item{flex:0 0 100%;height:450px;scroll-snap-align:center;background-size:cover;background-position:center;filter:grayscale(100%) contrast(1.06)}
    .gal-dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:7px}
    .gal-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .25s}
    .gal-dots i.on{background:var(--blanc);width:16px;border-radius:3px}
    .gal-tag{position:absolute;top:calc(env(safe-area-inset-top,0px)+66px);left:22px;font-size:8px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.85);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.3)}
    .d-head{padding:28px 28px 0}
    .d-ship{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--g50)}
    .d-brand{font-family:var(--serif);font-style:italic;font-weight:500;font-size:36px;letter-spacing:1px;margin-top:10px;line-height:1}
    .d-name{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--g70);margin-top:6px}
    .d-price{font-family:var(--serif);font-weight:500;font-size:33px;margin-top:18px;letter-spacing:1px}
    .d-price .inst{font-size:9px;font-weight:600;letter-spacing:2.5px;color:var(--g50);display:inline-block;margin-left:14px;text-transform:uppercase;font-family:var(--sans)}
    .d-sect{margin:28px 28px 0;border-top:1px solid var(--g15);padding-top:22px}
    .d-sect h4{font-size:9px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:var(--g70);margin-bottom:16px}
    .spec-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--g05);font-size:13px}
    .spec-row:last-child{border-bottom:none}
    .spec-row .k{color:var(--g50)}
    .spec-row .v{font-weight:600}
    .d-desc{font-family:var(--serif);font-size:16.5px;line-height:1.75;color:var(--g70)}
    .trust-box{background:var(--noir);color:var(--blanc);border-radius:4px;padding:24px}
    .trust-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
    .trust-top .t{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;line-height:1.8}
    .trust-top .t small{display:block;font-size:7.5px;letter-spacing:2.5px;color:var(--g50);margin-top:4px}
    .trust-top .sc{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:1px}
    .tr-row{margin-bottom:14px}
    .tr-row .l{display:flex;justify-content:space-between;font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;color:rgba(255,255,255,.85)}
    .tr-row .l b{font-family:var(--mono);font-weight:400;font-size:10px}
    .tr-bar{height:1px;background:rgba(255,255,255,.2)}
    .tr-bar i{display:block;height:100%;background:var(--blanc)}
    .tr-hash{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:9px;color:var(--g50);margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.14);letter-spacing:1px}
    .tr-hash svg{width:12px;height:12px;stroke:var(--g50)}
    .seller-row{display:flex;align-items:center;gap:16px}
    .seller-av{width:52px;height:52px;border-radius:50%;background:var(--noir);color:var(--blanc);font-family:var(--serif);font-size:22px;font-style:italic;display:flex;align-items:center;justify-content:center}
    .seller-row .nm{font-family:var(--serif);font-size:18px;font-style:italic}
    .seller-row .st{font-size:10.5px;color:var(--g50);margin-top:3px;letter-spacing:1px;text-transform:uppercase;font-weight:500}
    .seller-row .sc{margin-left:auto;text-align:right}
    .seller-row .sc .n{font-family:var(--serif);font-size:22px}
    .seller-row .sc .l{font-size:7.5px;letter-spacing:2px;text-transform:uppercase;color:var(--g50);font-weight:600;display:block;margin-top:2px}
    .d-cta{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--g15);padding:16px 24px calc(env(safe-area-inset-bottom,0px)+18px);display:flex;gap:12px;z-index:6}

    /* ═══ SHEET OFFRE ═══ */
    .overlay{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:fadeIn .25s}
    .sheet{width:100%;background:var(--blanc);border-radius:22px 22px 0 0;padding:14px 28px calc(env(safe-area-inset-bottom,0px)+28px);max-height:90dvh;overflow-y:auto;animation:slideup .4s var(--ease)}
    @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
    .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--g15);margin:0 auto 22px}
    .seal-banner{background:var(--noir);color:var(--blanc);border-radius:999px;padding:11px 18px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px}
    .seal-banner svg{width:12px;height:12px;stroke:#fff;stroke-width:1.6}
    .seal-banner span{font-size:8.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .sheet-title{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px;letter-spacing:.5px}
    .sheet-close{width:44px;height:44px;margin:-11px;border-radius:50%;border:1px solid var(--g15);display:flex;align-items:center;justify-content:center;color:var(--noir)}
    .sheet-close svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6}
    .prod-row{display:flex;gap:16px;align-items:center;margin-bottom:24px;background:var(--g05);border-radius:14px;padding:12px}
    .prod-thumb{width:62px;height:62px;border-radius:10px;background-size:cover;background-position:center;filter:grayscale(100%);flex-shrink:0}
    .prod-row .pb{font-family:var(--serif);font-style:italic;font-size:17px}
    .prod-row .pt{font-size:10px;color:var(--g50);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
    .prod-row .pp{font-family:var(--mono);font-size:10.5px;margin-top:5px;color:var(--g70)}
    .field-label{font-size:8.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--g70);margin-bottom:12px}
    .offer-num-row{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--noir);padding-bottom:10px;margin-bottom:16px}
    .offer-input{border:none;outline:none;font-family:var(--serif);font-weight:500;font-size:46px;letter-spacing:1px;width:100%;background:none;color:var(--noir)}

  /* ═══ SWIPE ═══ */
  function SwipeCard({p,next,rank,total,onOpen,onOffer,onToast,onFav,onSkip,canUndo,prev}){
    const[d,setD]=useState(null);
    const[out,setOut]=useState(null);
    const[snap,setSnap]=useState(false);
    const[rev,setRev]=useState(false);
    const st=useRef(null),t0=useRef(0);

    useEffect(()=>{setRev(false);const t=setTimeout(()=>setRev(true),3000);return()=>clearTimeout(t)},[p.id]);

    const tx=e=>e.touches?e.touches[0]:e;
    const down=e=>{st.current=tx(e);t0.current=Date.now();setSnap(false);setD({dx:0,dy:0})};
    const move=e=>{if(!st.current)return;const t=tx(e);setD({dx:t.clientX-st.current.clientX,dy:t.clientY-st.current.clientY})};
    const up=()=>{
      if(!d)return;
      const{dx,dy}=d,dt=(Date.now()-t0.current)/1000,v=Math.abs(dx)/(dt||.3);
      st.current=null;setD(null);
      const fast=v>900;
      if((dy<-110||(dy<-60&&fast))&&Math.abs(dy)>Math.abs(dx)){setOut('up');setTimeout(()=>onOffer(p),320)}
      else if(dx>90||(dx>50&&fast)){setOut('right');setTimeout(()=>{onToast('Gardé — vers votre dressing');onFav(p)},380)}
      else if(dx<-90||(dx<-50&&fast)){setOut('left');setTimeout(onSkip,380)}
      else{setSnap(true);setD({dx:0,dy:0})}
    };

    const cls='card '+(out==='left'?'fly out-left':out==='right'?'fly out-right':out==='up'?'fly out-up':'fg')+(d&&!out?' dragging':'')+(snap?' snap':'');
    const rot=(d?d.dx:0)/22;
    const sty={...(d&&!out?{transform:`translate(${d.dx}px,${d.dy}px) rotate(${rot}deg)`,opacity:Math.max(.65,1-Math.abs(d.dx)/750)}:{})};

    return<>
      {next&&<div className="card behind"><div className="ph" style={{backgroundImage:`url(${next.img})`}}/></div>}
      <div className={cls} style={sty}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={()=>{st.current=null;setD(null)}}>
        <div className="ph" style={{backgroundImage:`url(${p.img})`}}/>
        <div className={'stamp s-l'+(d&&d.dx<-40?' show':'')}>Passer</div>
        <div className={'stamp s-r'+(d&&d.dx>40?' show':'')}>Garder</div>
        <div className={'stamp s-u'+(d&&d.dy<-50?' show':'')}>Offrir</div>
        <div className="card-content" onClick={()=>onOpen(p)} style={{pointerEvents:'auto'}}>
          <div className="lot-line"><span className="dot"/><span>Lot {String(rank).padStart(2,'0')} sur {total} {p.select?'· Lokko Select':''}</span></div>
          <div className="p-brand">{p.brand}</div>
          <div className="p-title">{p.title}</div>
          <div className={'price-zone'+(rev?' revealed':'')}>
            <span className="price-blur">•••••&nbsp;{p.cur}</span>
            <span className="price-real">{p.price.toLocaleString('fr-FR')}<span className="cur">{p.cur}</span></span>
          </div>
          <div className="drop-prog">
            <div className="bar"><i style={{width:(p.pct*100)+'%'}}/></div>
            <div className="lbl"><span>Fin dans {p.timer}</span><span>{p.offers} offres</span></div>
          </div>
        </div>
      </div>
      <div className="dock">
        <button className="rnd" onClick={()=>{setOut('left');setTimeout(onSkip,380)}}>{I.x}</button>
        <button className="cta" onClick={()=>{setOut('up');setTimeout(()=>onOffer(p),320)}}>{I.bolt} Faire une offre</button>
        <button className="rnd" onClick={()=>{setOut('right');setTimeout(()=>{onToast('Gardé — vers votre dressing');onFav(p)},380)}}>{I.heart}</button>
      </div>
      <div className="dock-tip"><span>Glissez pour offrir · touchez la carte pour le dossier complet</span></div>
      {canUndo&&<button className="undo" onClick={prev}>{I.undo}</button>}
    </>;
  }

        <div className="ring-wrap">
          <svg viewBox="0 0 120 120"><circle className="ring-bg" cx="60" cy="60" r="56"/><circle className="ring-fg" cx="60" cy="60" r="56" strokeDasharray="352" strokeDashoffset={352*(1-0.94)}/></svg>
          <div className="ring-center"><div className="n">94</div><div className="l">Confiance</div></div>
        </div>
        <h2>Marwen</h2>
        <div className="loc">Tunis · Membre depuis janvier 2025</div>
      </div>
      <div className="stats-row">
        <div className="stat"><div className="n">47</div><div className="l">Ventes</div></div>
        <div className="stat"><div className="n">4.8</div><div className="l">Note</div></div>
        <div className="stat"><div className="n">0</div><div className="l">Litiges</div></div>
        <div className="stat"><div className="n">2h</div><div className="l">Réponse</div></div>
      </div>
      <div className="search-wrap" style={{paddingTop:24}}>
        <div className="section-title">IA Stylist — vos lignes</div>
        <div className="pref-panel">
          <div className="pref-row"><span className="k">Minimaliste ↔ Avant-garde</span><input type="range" min="0" max="100" defaultValue="62" style={{'--val':'62%'}}/></div>
          <div className="pref-row"><span className="k">Budget</span><input type="range" min="0" max="100" defaultValue="74" style={{'--val':'74%'}}/></div>
          <div className="pref-row"><span className="k">Courant ↔ Pièce unique</span><input type="range" min="0" max="100" defaultValue="88" style={{'--val':'88%'}}/></div>
        </div>
        <div className="section-title">Compte</div>
        <div className="chips"><span className="chip">Français</span><span className="chip">€ / AED</span><span className="chip">Notifications</span><span className="chip">Confidentialité</span></div>
      </div>
    </div>;
  }

  const Nav=({tab})=>(
    <div className={'nav'+(tab==='feed'?' dark':'')}>
      <button className={'nav-item'+(tab==='feed'?' active':'')} onClick={()=>tabSet('feed')}>{I.home}<span>Feed</span></button>
      <button className={'nav-item'+(tab==='search'?' active':'')} onClick={()=>tabSet('search')}>{I.search}<span>Explorer</span></button>
      <button className="nav-plus" onClick={()=>tabSet('sell')}>{I.plus}</button>
      <button className={'nav-item'+(tab==='dressing'?' active':'')} onClick={()=>tabSet('dressing')}>{I.dress}<span>Dressing</span></button>
      <button className={'nav-item'+(tab==='profile'?' active':'')} onClick={()=>tabSet('profile')}>{I.user}<span>Profil</span></button>
    </div>
  );
  let tabSet=null;

  function App(){
    const[phase,setPhase]=useState('splash');
    const[tab,setTab]=useState('feed');
    const[idx,setIdx]=useState(0);
    const[hist,setHist]=useState([]);
    const[open,setOpen]=useState(null);
    const[bid,setBid]=useState(null);
    const[alert,setAlert]=useState(false);
    const[toast,setToast]=useState(null);
    const tt=useRef(null);
    tabSet=setTab;

    useEffect(()=>{const t=setTimeout(()=>setPhase('onboard'),2400);return()=>clearTimeout(t)},[]);

    const sh=m=>{clearTimeout(tt.current);setToast(m);tt.current=setTimeout(()=>setToast(null),2600)};
    const next=()=>{setHist(h=>[...h,idx]);setIdx(i=>i+1)};
    const prev=()=>{setHist(h=>{if(!h.length)return h;setIdx(h[h.length-1]);return h.slice(0,-1)})};
    const p=PRODUCTS[idx];

    return(
      <div className="app">
        {phase==='splash'&&<Splash/>}
        {phase==='onboard'&&<Onboard done={()=>setPhase('app')}/>}
        {phase==='app'&&<>
          {tab==='feed'&&(p?<>
            <TopBar timer={p.timer} inv={1}/>
            <div className="feed">
              <SwipeCard key={p.id} p={p} next={PRODUCTS[idx+1]} rank={idx+1} total={PRODUCTS.length}
                onOpen={setOpen} onOffer={setBid} onToast={sh}
                onFav={()=>next()} onSkip={next}
                canUndo={hist.length>0} prev={prev}/>
            </div>
          </>:<>
            <div className="feed"><div className="feed-end">
              <div className="rule"/>
              <h3>Le luxe<br/>respire.</h3>
              <p>Revenez demain —<br/>l'IA affine en silence</p>
              <button className="btn-black" style={{width:230,marginTop:14,background:'#fff',color:'#000'}} onClick={()=>{setIdx(0);setHist([])}}>Recommencer</button>
            </div></div>
          </>)}
          {tab==='search'&&<div className="screen"><Search/></div>}
          {tab==='sell'&&<div className="screen"><Studio onToast={sh}/></div>}
          {tab==='dressing'&&<div className="screen"><Dressing onAlert={()=>setAlert(true)}/></div>}
          {tab==='profile'&&<div className="screen"><Profile/></div>}
          {tab!=='feed'&&<TopBar inv={0}/>}
          <Nav tab={tab}/>
        </>}
        {open&&<Detail p={open} onBack={()=>setOpen(null)} onOffer={pp=>setBid(pp)} onToast={sh}/>}
        {bid&&<BidSheet p={bid} onClose={()=>setBid(null)} onSubmit={()=>{sh('Offre transmise au vendeur');setOpen(null)}}/>}
        {alert&&<AdjustModal onClose={()=>setAlert(false)} onToast={sh}/>}
        {toast&&<div className="toast">{I.check}{toast}</div>}
      </div>
    );
  }

  function TopBar({timer,inv}){
    return timer?(
      <div className={'topbar'+(inv?' inv':'')}>
        <div className="wm">LOKKO</div>
        <div className={'timer-chip'+(inv?'':' on-light')}>{I.clock}{timer}</div>
      </div>
    ):(
      <div className="topbar"><div className="wm">LOKKO</div></div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
