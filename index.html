<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>LOKKO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,87.5,700;0,87.5,900;1,87.5,700;1,87.5,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       LOKKO — "Kinetic Monochrome Editorial"
       D'après Stitch · #000 / #111 / #F4F4F4
       Anybody (condensed italic) · Hanken Grotesk
       ═══════════════════════════════════════════ */
    :root{
      --noir:#000; --g11:#111; --blanc:#fff; --neu:#F4F4F4; --g50:gray; --g30:#B3B3B3; --g10:#E4E4E4;
      --display:'Anybody','Archivo',Impact,sans-serif;
      --body:'Hanken Grotesk',-apple-system,sans-serif;
      --mono:'JetBrains Mono',monospace;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{font-family:var(--body);background:var(--noir);overflow:hidden;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--noir);color:var(--blanc)}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{display:none}
    .app{width:100%;height:100dvh;max-width:430px;margin:0 auto;background:var(--blanc);position:relative;overflow:hidden;display:flex;flex-direction:column}
    .disp{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase}
    .micro{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:8.5px;letter-spacing:2.2px;text-transform:uppercase}

    /* ═══ SPLASH ═══ */
    .splash{position:absolute;inset:0;z-index:500;background:var(--noir);color:var(--blanc);display:flex;flex-direction:column;justify-content:flex-end;padding:44px;animation:splashOut .6s var(--ease) 1.5s forwards}
    .splash .wm{font-family:var(--display);font-stretch:87.5%;font-style:italic;font-weight:900;font-size:66px;letter-spacing:-2px;line-height:.92;text-transform:uppercase;animation:wordIn .7s var(--ease) both}
    .splash .wm span{display:block;font-size:10px;font-style:normal;font-weight:700;letter-spacing:5px;margin-top:16px;color:var(--g50)}
    @keyframes wordIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @keyframes splashOut{to{opacity:0;visibility:hidden}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ═══ ONBOARDING ═══ */
    .onboard{position:absolute;inset:0;z-index:400;background:var(--blanc);padding:calc(env(safe-area-inset-top,0px)+56px) 28px 40px;display:flex;flex-direction:column;animation:fadeIn .4s}
    .onboard h1{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:38px;line-height:.98;letter-spacing:-1px}
    .onboard .ob-sub{font-size:13px;color:#333;margin-top:12px;line-height:1.6}
    .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
    .ob-chip{border:1.5px solid var(--noir);border-radius:999px;padding:16px;font-family:var(--display);font-stretch:87.5%;font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:1.5px;min-height:56px;display:flex;align-items:center;justify-content:center;transition:all .18s}
    .ob-chip.on{background:var(--noir);color:var(--blanc)}
    .ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}

    /* ═══ BOUTONS ═══ */
    .btn-black{width:100%;min-height:56px;border-radius:999px;background:var(--noir);color:var(--blanc);font-family:var(--display);font-stretch:87.5%;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
    .btn-black:active{transform:scale(.97);opacity:.85}
    .btn-white{width:100%;min-height:56px;border-radius:999px;background:var(--blanc);color:var(--noir);border:1.5px solid var(--noir);font-family:var(--display);font-stretch:87.5%;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-white:active{transform:scale(.97)}
    .btn-ghost{width:100%;min-height:48px;border-radius:999px;color:var(--g50);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;justify-content:center}

    /* ═══ TOP BAR NOIRE (feed) ═══ */
    .topbar{position:absolute;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px)+12px) 18px 0;height:calc(env(safe-area-inset-top,0px)+54px);pointer-events:none}
    .topbar .wm{font-family:var(--display);font-stretch:87.5%;font-style:italic;font-weight:900;text-transform:uppercase;font-size:18px;letter-spacing:-.5px;margin-left:6px;color:var(--blanc)}
    .topbar .drop{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:8px;letter-spacing:2.5px;color:rgba(255,255,255,.75);margin-left:10px}
    .timer-chip{display:flex;align-items:center;gap:7px;pointer-events:auto;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:1px;background:var(--noir);color:var(--blanc);padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
    .timer-chip svg{width:12px;height:12px;stroke:currentColor}

    /* ═══ FEED ═══ */
    .feed{flex:1;position:relative;background:var(--noir);overflow:hidden}
    .card{position:absolute;inset:8px 8px 8px;border-radius:4px;overflow:hidden;background:var(--noir);will-change:transform,opacity;touch-action:none}
    .ph{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(100%) contrast(1.12)}
    .card.behind{transform:scale(.94) translateY(14px);z-index:1}
    .card.fg{z-index:2;animation:cardIn .45s var(--ease) both}
    @keyframes cardIn{from{transform:scale(1.03)}to{transform:none}}
    .card.dragging{transition:none;animation:none}
    .card.fly{transition:transform .42s var(--ease),opacity .42s}
    .card.out-left{transform:translate(-130%,0) rotate(-10deg)!important;opacity:0}
    .card.out-right{transform:translate(130%,0) rotate(10deg)!important;opacity:0}
    .card.out-up{transform:translate(0,-130%) scale(.92)!important;opacity:0}
    .card.snap{transition:transform .32s var(--ease)}
    .card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.35) 30%,transparent 52%),linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 22%)}
    .card-content{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px 186px;color:var(--blanc)}

    .stamp{position:absolute;top:120px;z-index:9;font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:24px;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;opacity:0;transition:opacity .12s;pointer-events:none}
    .stamp.s-l{left:22px;transform:rotate(-14deg);color:#fff;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
    .stamp.s-r{right:22px;transform:rotate(-14deg);display:flex;align-items:center;gap:8px;background:var(--noir);border:2px solid #fff}
    .stamp.s-r svg{width:15px;height:15px;stroke:#fff}
    .stamp.s-u{top:150px;left:50%;margin-left:-85px;width:170px;text-align:center;transform:rotate(-3deg);background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.75)}
    .stamp.show{opacity:1}

    .eyebrow-live{display:flex;align-items:center;gap:7px;margin-bottom:12px}
    .eyebrow-live .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .eyebrow-live span{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:8.5px;letter-spacing:2.5px;color:rgba(255,255,255,.85)}
    .p-brand{font-family:var(--display);font-stretch:87.5%;font-style:italic;font-weight:900;text-transform:uppercase;font-size:36px;letter-spacing:-1.2px;line-height:.95;text-shadow:0 2px 20px rgba(0,0,0,.4)}
    .p-title{font-family:var(--display);font-stretch:87.5%;font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:2px;margin-top:7px;color:rgba(255,255,255,.9)}
    .price-zone{height:44px;margin-top:12px;position:relative}
    .price-blur{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:15px;letter-spacing:6px;color:rgba(255,255,255,.7);background:rgba(17,17,17,.72);backdrop-filter:blur(10px);padding:9px 20px 9px 25px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
    .price-real{position:absolute;left:2px;top:-2px;font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:33px;letter-spacing:-1px;opacity:0;transform:translateY(12px);transition:all .55s var(--ease)}
    .price-real .cur{font-size:17px;margin-left:5px;color:rgba(255,255,255,.75)}
    .price-zone.revealed .price-blur{opacity:0;transform:scale(.95)}
    .price-zone.revealed .price-real{opacity:1;transform:none}
    .drop-prog{margin-top:14px}
    .drop-prog .bar{height:3px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
    .drop-prog .bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;transition:width .4s var(--ease)}
    .drop-prog .lbl{display:flex;justify-content:space-between;margin-top:6px}
    .drop-prog .lbl span{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:7.5px;letter-spacing:2px;color:rgba(255,255,255,.6)}

    /* dock façon Stitch : X | OFFRE pleine largeur | coeur */
    .dock{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px)+96px);z-index:8;display:flex;align-items:center;gap:12px}
    .dock .rnd{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;transition:transform .15s}
    .dock .rnd:active{transform:scale(.86)}
    .dock .rnd svg{width:19px;height:19px;stroke:#fff}
    .dock .cta{flex:1;min-height:54px;border-radius:999px;background:var(--blanc);color:var(--noir);font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:13.5px;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .15s}
    .dock .cta:active{transform:scale(.97)}
    .dock .cta svg{width:15px;height:15px;stroke:var(--noir)}
    .dock-tip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px)+78px);z-index:8;display:flex;justify-content:center;pointer-events:none}
    .dock-tip span{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:7.5px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.5)}
    .undo{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+96px);right:18px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4)}
    .undo svg{width:17px;height:17px;stroke:#fff}

    /* ═══ NAV ═══ */
    .nav{position:absolute;bottom:0;left:0;right:0;z-index:70;height:calc(env(safe-area-inset-bottom,0px)+72px);background:var(--noir);display:flex;align-items:center;justify-content:space-around;padding-bottom:calc(env(safe-area-inset-bottom,0px)}
    .nav{border-top:1px solid rgba(255,255,255,.12)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:48px;min-height:44px;justify-content:center;color:rgba(255,255,255,.45);transition:color .2s}
    .nav-item svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6}
    .nav-item span{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:7.5px;letter-spacing:2px;text-transform:uppercase}
    .nav-item.active{color:var(--blanc)}
    .nav-plus{width:50px;height:50px;border-radius:50%;background:var(--blanc);color:var(--noir);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .15s}
    .nav-plus:active{transform:scale(.9)}
    .nav-plus svg{width:21px;height:21px;stroke:var(--noir);stroke-width:2.4}

    /* ═══ FICHE PRODUIT ═══ */
    .detail{position:absolute;inset:0;z-index:120;background:var(--blanc);display:flex;flex-direction:column;animation:slideIn .38s var(--ease)}
    @keyframes slideIn{from{transform:translateY(4%);opacity:0}to{transform:none;opacity:1}}
    .detail-nav{position:absolute;top:calc(env(safe-area-inset-top,0px)+10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:5}
    .icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--g10);display:flex;align-items:center;justify-content:center}
    .icon-btn svg{width:17px;height:17px;stroke:var(--noir)}
    .detail-body{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px)+100px)}
    .gal{position:relative;background:var(--noir)}
    .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}
    .gal-item{flex:0 0 100%;height:440px;scroll-snap-align:center;background-size:cover;background-position:center;filter:grayscale(100%) contrast(1.12)}
    .gal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
    .gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
    .gal-dots i.on{background:var(--blanc);width:18px;border-radius:3px}
    .gal-count{position:absolute;bottom:10px;right:16px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.9)}
    .gal-tags{position:absolute;top:calc(env(safe-area-inset-top,0px)+64px);left:16px;display:flex;gap:6px}
    .gtag{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:7.5px;letter-spacing:2px;text-transform:uppercase;background:var(--noir);color:var(--blanc);border:1px solid rgba(255,255,255,.5);padding:6px 10px;border-radius:999px}
    .gtag.cert{background:var(--blanc);color:var(--noir);border-color:var(--blanc)}
    .d-head{padding:22px 22px 0}
    .d-ship{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g50)}
    .d-brand{font-family:var(--display);font-stretch:87.5%;font-style:italic;font-weight:900;text-transform:uppercase;font-size:32px;letter-spacing:-1.2px;margin-top:6px;line-height:.95}
    .d-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:2px;margin-top:6px}
    .d-price{font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:30px;margin-top:14px;letter-spacing:-1px}
    .d-price .inst{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--g50);display:inline-block;margin-left:12px;text-transform:uppercase}
    .d-sect{margin:24px 22px 0;border-top:1px solid var(--g10);padding-top:18px}
    .d-sect h4{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:11.5px;letter-spacing:2.5px;margin-bottom:13px}
    .spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0F0F0;font-size:13px}
    .spec-row:last-child{border-bottom:none}
    .spec-row .k{color:var(--g50);font-weight:500}
    .spec-row .v{font-weight:700}
    .d-desc{font-size:13.5px;line-height:1.7;color:#333}
    .trust-box{background:var(--noir);color:var(--blanc);border-radius:14px;padding:20px}
    .trust-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
    .trust-top .t{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:2px;line-height:1.5}
    .trust-top .t small{display:block;font-size:7.5px;letter-spacing:2px;color:var(--g30);font-weight:700;margin-top:3px}
    .trust-top .sc{font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:34px;letter-spacing:-1px}
    .tr-row{margin-bottom:12px}
    .tr-row .l{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase;font-family:var(--display);font-stretch:87.5%}
    .tr-row .l b{font-family:var(--mono);font-weight:500;text-transform:none}
    .tr-bar{height:4px;background:rgba(255,255,255,.18)}
    .tr-bar i{display:block;height:100%;background:var(--blanc)}
    .tr-hash{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--g30);margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.15)}
    .seller-row{display:flex;align-items:center;gap:14px}
    .seller-av{width:54px;height:54px;border-radius:50%;background:var(--noir);color:var(--blanc);font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
    .seller-row .nm{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.5px}
    .seller-row .st{font-size:11.5px;color:var(--g50);margin-top:3px;font-weight:500}
    .seller-row .sc{margin-left:auto;text-align:right}
    .seller-row .sc .n{font-family:var(--display);font-stretch:87.5%;font-weight:900;font-size:20px}
    .seller-row .sc .l{font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g50);font-weight:700;text-align:right;display:block}
    .d-cta{position:absolute;bottom:0;left:0;right:0;background:var(--blanc);border-top:1px solid var(--g10);padding:14px 20px calc(env(safe-area-inset-bottom,0px)+16px);display:flex;gap:10px;z-index:6}

    /* ═══ SHEET OFFRE ═══ */
    .overlay{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fadeIn .2s}
    .sheet{width:100%;background:var(--blanc);border-radius:18px 18px 0 0;padding:12px 24px calc(env(safe-area-inset-bottom,0px)+26px);max-height:90dvh;overflow-y:auto;animation:slideup .35s var(--ease)}
    @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
    .sheet-handle{width:44px;height:4px;border-radius:2px;background:var(--g30);margin:0 auto 16px}
    .seal-banner{background:var(--noir);color:var(--blanc);border-radius:999px;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
    .seal-banner svg{width:13px;height:13px;stroke:#fff}
    .seal-banner span{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .sheet-title{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:23px;letter-spacing:-.8px}
    .sheet-close{width:44px;height:44px;margin:-11px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--noir)}
    .sheet-close svg{width:17px;height:17px;stroke:currentColor;stroke-width:2}
    .prod-row{display:flex;gap:14px;align-items:center;margin-bottom:20px;background:var(--neu);border-radius:12px;padding:10px}
    .prod-thumb{width:60px;height:60px;border-radius:8px;background-size:cover;background-position:center;filter:grayscale(100%);flex-shrink:0}
    .prod-row .pb{font-family:var(--display);font-stretch:87.5%;font-weight:900;text-transform:uppercase;font-size:13.5px;letter-spacing:.3px}
    .prod-row .pt{font-size:10.5px;color:var(--g50);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
    .prod-row .pp{font-family:var(--mono);font-size:11.5px;margin-top:4px;font-weight:500}
    .field-label{font-family:var(--display);font-stretch:87.5%;font-size:9.5px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:10px}
    .offer-num-row{display:flex;align-items:baseline;gap:10px;border-bottom:2.5px solid var(--noir);padding-bottom:8px;margin-bottom:14px}

  /* ═══ SWIPE CARD ═══ */
  function SwipeCard({p,next,rank,total,onOpen,onOffer,onToast,onFav,onSkip,canUndo,prev}){
    const[d,setD]=useState(null);
    const[out,setOut]=useState(null);
    const[snap,setSnap]=useState(false);
    const[rev,setRev]=useState(false);
    const st=useRef(null),t0=useRef(0);

    useEffect(()=>{setRev(false);const t=setTimeout(()=>setRev(true),3000);return()=>clearTimeout(t)},[p.id]);

    const tx=e=>e.touches?e.touches[0]:e;
    const down=e=>{st.current=tx(e);t0.current=Date.now();setSnap(false);setD({dx:0,dy:0})};
    const move=e=>{if(!st.current)return;const t=tx(e);setD({dx:t.clientX-st.current.clientX,dy:t.clientY-st.current.clientY})};
    const up=()=>{
      if(!d)return;
      const{dx,dy}=d,dt=(Date.now()-t0.current)/1000,v=Math.abs(dx)/(dt||.3);
      st.current=null;setD(null);
      const fast=v>900;
      if((dy<-110||(dy<-60&&fast))&&Math.abs(dy)>Math.abs(dx)){setOut('up');setTimeout(()=>onOffer(p),300)}
      else if(dx>90||(dx>50&&fast)){setOut('right');setTimeout(()=>{onToast('Gardé · vers Dressing');onFav(p)},360)}
      else if(dx<-90||(dx<-50&&fast)){setOut('left');setTimeout(onSkip,360)}
      else{setSnap(true);setD({dx:0,dy:0})}
    };

    const cls='card '+(out==='left'?'fly out-left':out==='right'?'fly out-right':out==='up'?'fly out-up':'fg')+(d&&!out?' dragging':'')+(snap?' snap':'');
    const rot=(d?d.dx:0)/20;
    const st2={...(d&&!out?{transform:`translate(${d.dx}px,${d.dy}px) rotate(${rot}deg)`,opacity:Math.max(.6,1-Math.abs(d.dx)/700)}:{})};

    return<>
      {next&&<div className="card behind"><div className="ph" style={{backgroundImage:`url(${next.img})`}}/></div>}
      <div className={cls} style={st2}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={()=>{st.current=null;setD(null)}}>
        <div className="ph" style={{backgroundImage:`url(${p.img})`}}/>
        <div className={'stamp s-l'+(d&&d.dx<-40?' show':'')}>Ignorer</div>
        <div className={'stamp s-r'+(d&&d.dx>40?' show':'')}>{I.heart} Garder</div>
        <div className={'stamp s-u'+(d&&d.dy<-50?' show':'')}>Offrir ↑</div>
        <div className="card-content" onClick={()=>onOpen(p)} style={{pointerEvents:'auto'}}>
          <div className="eyebrow-live"><span className="dot"/><span>LOT {String(rank).padStart(2,'0')} / {total} · DROP DU JOUR {p.select?'· SELECT':''}</span></div>
          <div className="p-brand">{p.brand}</div>
          <div className="p-title">{p.title}</div>
          <div className={'price-zone'+(rev?' revealed':'')}>
            <span className="price-blur">•••••&nbsp;{p.cur}</span>
            <span className="price-real">{p.price.toLocaleString('fr-FR')}<span className="cur">{p.cur}</span></span>
          </div>
          <div className="drop-prog">
            <div className="bar"><i style={{width:(p.pct*100)+'%'}}/></div>
            <div className="lbl"><span>Timer {p.timer}</span><span>{p.offers} offres reçues</span></div>
          </div>
        </div>
      </div>
      <div className="dock">
        <button className="rnd" onClick={()=>{setOut('left');setTimeout(onSkip,360)}} title="Passer">{I.x}</button>
        <button className="cta" onClick={()=>{setOut('up');setTimeout(()=>onOffer(p),300)}}>{I.bolt} Faire une offre</button>
        <button className="rnd" onClick={()=>{setOut('right');setTimeout(()=>{onToast('Gardé · vers Dressing');onFav(p)},360)}} title="Garder">{I.heart}</button>
      </div>
      <div className="dock-tip"><span>Glisse gauche pour ignorer · droite pour garder · haut pour offrir</span></div>
      {canUndo&&<button className="undo" onClick={prev}>{I.undo}</button>}
    </>;
  }

  function BidSheet({p,onClose,onSubmit}){
    const[min,setMin]=useState(Math.round(p.price*0.7));

    const[dur,setDur]=useState(48);
    const lo=Math.round(p.price*0.55),hi=Math.round(p.price*1.2);
    const ia=Math.round(p.price*1.0);
    const pos=Math.max(0,Math.min(1,(amt-lo)/(hi-lo)))*100;
    const g70=((min-lo)/(hi-lo))*100;
    const odds=amt<min?-1:amt<ia*0.9?2:amt<ia*1.02?3:amt<ia*1.1?2:1;
    return(
      <div className="overlay" onClick={onClose}>

            <div className="mkt-track">
              <div className="mkt-gold" style={{left:0,right:(100-g70)+'%'}}/>
              <div className="mkt-dot" style={{left:pos+'%'}}/>
            </div>
            <div className="mkt-marks"><span>Plancher</span><span>70% · {min.toLocaleString('fr-FR')} {p.cur}</span><span>Marché IA</span></div>

        <div className="search-bar">{I.search}<input placeholder="Marque, pièce, référence..."/></div>
        <div className="field-label" style={{marginTop:22}}>Mes tailles</div>
        <div className="chips">{['XS','S','M','L','XL','40','41','42'].map(s=><button key={s} className={'chip'+(size===s?' on':'')} onClick={()=>setSize(size===s?null:s)}>{s}</button>)}</div>
        <div className="section-title">Tendance 24h</div>
        <div className="trend-row">{PRODUCTS.slice(0,5).map(p=>
          <div className="trend-card" key={p.id}>
            <div className="im" style={{backgroundImage:`url(${p.img})`}}/>
            <div className="b">{p.brand}</div><div className="n">{140-p.id*17} likes</div>
          </div>)}</div>
        <div className="section-title">Repartis vite</div>
        <div className="trend-row">{PRODUCTS.slice(1,4).map(p=>
          <div className="trend-card" key={p.id}>
            <div className="im" style={{backgroundImage:`url(${p.img})`}}/>
            <div className="b">{p.brand}</div><div className="n hot">Vendu en {p.id}h{p.id*13%60}</div>
          </div>)}</div>
      </div>
    );
  }

  /* ═══ PROFIL ═══ */
  function Profile(){
    return<div>
      <div className="profile-hero">
        <div className="ring-wrap">
          <svg viewBox="0 0 120 120"><circle className="ring-bg" cx="60" cy="60" r="56"/><circle className="ring-fg" cx="60" cy="60" r="56" strokeDasharray="352" strokeDashoffset={352*(1-0.94)}/></svg>
          <div className="ring-center"><div className="n">94</div><div className="l">Trust</div></div>
        </div>
        <h2>Marwen</h2>
        <div className="loc">Tunis · Depuis Jan 2025</div>
      </div>
      <div className="stats-row">
        <div className="stat"><div className="n">47</div><div className="l">Ventes</div></div>
        <div className="stat"><div className="n">4.8</div><div className="l">Note</div></div>
        <div className="stat"><div className="n">0</div><div className="l">Litiges</div></div>
        <div className="stat"><div className="n">2h</div><div className="l">Réponse</div></div>
      </div>
      <div className="search-wrap" style={{paddingTop:20}}>
        <div className="section-title">AI Stylist</div>
        <div className="pref-panel">
          <div className="pref-row"><span className="k">Minimaliste ↔ Avant-garde</span><input type="range" min="0" max="100" defaultValue="62" style={{'--val':'62%'}}/></div>
          <div className="pref-row"><span className="k">Budget</span><input type="range" min="0" max="100" defaultValue="74" style={{'--val':'74%'}}/></div>
          <div className="pref-row"><span className="k">Courant ↔ Pièce unique</span><input type="range" min="0" max="100" defaultValue="88" style={{'--val':'88%'}}/></div>
        </div>
        <div className="section-title">Compte</div>
        <div className="chips"><span className="chip">FR</span><span className="chip">€/AED</span><span className="chip">Notifications</span><span className="chip">RGPD</span></div>
      </div>
    </div>;
  }

  const Nav=({tab,setTab})=>(
    <div className="nav">
      <button className={'nav-item'+(tab==='feed'?' active':'')} onClick={()=>setTab('feed')}>{I.home}<span>Feed</span></button>
      <button className={'nav-item'+(tab==='search'?' active':'')} onClick={()=>setTab('search')}>{I.search}<span>Explorer</span></button>
      <button className="nav-plus" onClick={()=>setTab('sell')}>{I.plus}</button>
      <button className={'nav-item'+(tab==='dressing'?' active':'')} onClick={()=>setTab('dressing')}>{I.dress}<span>Dressing</span></button>
      <button className={'nav-item'+(tab==='profile'?' active':'')} onClick={()=>setTab('profile')}>{I.user}<span>Profil</span></button>
    </div>
  );

  /* ═══ APP ═══ */
  function App(){
    const[phase,setPhase]=useState('splash');
    const[tab,setTab]=useState('feed');
    const[idx,setIdx]=useState(0);
    const[hist,setHist]=useState([]);
    const[open,setOpen]=useState(null);
    const[bid,setBid]=useState(null);
    const[alert,setAlert]=useState(false);
    const[toast,setToast]=useState(null);
    const tt=useRef(null);

    useEffect(()=>{const t=setTimeout(()=>setPhase('onboard'),2100);return()=>clearTimeout(t)},[]);

    const sh=m=>{clearTimeout(tt.current);setToast(m);tt.current=setTimeout(()=>setToast(null),2400)};
    const next=()=>{setHist(h=>[...h,idx]);setIdx(i=>i+1)};
    const prev=()=>{setHist(h=>{if(!h.length)return h;setIdx(h[h.length-1]);return h.slice(0,-1)})};
    const p=PRODUCTS[idx];

    return(
      <div className="app">
        {phase==='splash'&&<Splash/>}
        {phase==='onboard'&&<Onboard done={()=>setPhase('app')}/>}
        {phase==='app'&&<>
          {tab==='feed'&&(p?<>
            <TopBar timer={p.timer} drop={1}/>
            <div className="feed">
              <SwipeCard key={p.id} p={p} next={PRODUCTS[idx+1]} rank={idx+1} total={PRODUCTS.length}
                onOpen={setOpen} onOffer={setBid} onToast={sh}
                onFav={()=>next()} onSkip={next}
                canUndo={hist.length>0} prev={prev}/>
            </div>
          </>:<>
            <div className="feed"><div className="feed-end">
              <h3>Le luxe<br/>respire.</h3>
              <p>Revenez demain —<br/>l'IA affine en silence</p>
              <button className="btn-black" style={{width:220,marginTop:10,background:'#fff',color:'#000'}} onClick={()=>{setIdx(0);setHist([])}}>Recommencer</button>
            </div></div>
          </>)}
          {tab==='search'&&<div className="screen"><Search/></div>}
          {tab==='sell'&&<div className="screen"><Studio onToast={sh}/></div>}
          {tab==='dressing'&&<div className="screen"><Dressing onAlert={()=>setAlert(true)}/></div>}
          {tab==='profile'&&<div className="screen"><Profile/></div>}
          <Nav tab={tab} setTab={setTab}/>
        </>}
        {open&&<Detail p={open} onBack={()=>setOpen(null)} onOffer={pp=>setBid(pp)} onToast={sh}/>}
        {bid&&<BidSheet p={bid} onClose={()=>setBid(null)} onSubmit={()=>{sh('Offre secrète envoyée');setOpen(null)}}/>}
        {alert&&<AdjustModal onClose={()=>setAlert(false)} onToast={sh}/>}
        {toast&&<div className="toast">{I.check}{toast}</div>}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
